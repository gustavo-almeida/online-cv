career-profile:
  title: Resumo
  summary: |
    Profissional com mais de 10 anos de experiência em Qualidade de Software, atuando com testes manuais, automatizados e não funcionais em diferentes tipos de aplicações, com forte foco em automação, qualidade contínua e engenharia de testes.

    Experiência sólida em criação e evolução de frameworks de testes, testes de API, UI, mobile/responsivo e performance, utilizando ferramentas como Playwright, Cypress, k6, Apache JMeter e Postman.

    Formado em Sistemas de Informação e com MBA em Big Data e Business Analytics.
