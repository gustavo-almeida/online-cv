experiences:
  title: Experiência
  info:
    - role: QA Engineer
      time: Jun 2023 - Presente
      company: Loja Integrada
      details: |
        Atuação estratégica em iniciativas globais de qualidade e engenharia de testes, integrando também o squad focado no ecossistema de marketplace da plataforma.
        - Eficiência de Pipeline: Refatoração e consolidação de múltiplos projetos isolados de health check em um repositório unificado utilizando Playwright e TypeScript, otimizando o tempo de manutenção.
        - Modernização da Stack: Migração completa da suite de testes de UI (Cypress) e testes de API (Postman) para Playwright, unificando a stack técnica e aumentando a estabilidade das execuções em CI/CD.
        - Performance em Alta Escala: Liderança do planejamento e execução de testes de carga e estresse utilizando k6 (migrados do JMeter), garantindo a resiliência e estabilidade da plataforma em eventos críticos de alta volumetria, como a Black Friday.

    - role: QA Engineer
      time: Jun 2022 - Apr 2023
      company: CI&T
      details: |
        - Liderança da estratégia de testes de uma aplicação financeira do mercado de fundos de um dos maiores bancos do Brasil.
        - Refatoração de projeto end-to-end utilizando Cypress e Javascript.
        - Manutenção e evolução de testes automatizados com Selenium, .NET Core e SpecFlow.
        - Integração de testes automatizados em pipelines AWS CodeBuild e GitHub Actions.
        - Criação de documentações em formato BDD e colaboração próxima com times de UX e desenvolvimento.

    - role: QA Engineer
      time: Mar 2018 - Jun 2022
      company: VTEX
      details: |
        - Liderança de testes de carga em plataformas de e-commerce de alta escala.
        - Implementação de cultura e processos de testes dentro de times ágeis.
        - Desenvolvimento de testes automatizados de API e UI para pipelines CI/CD.
        - Testes de integração utilizando Postman/Newman e automações UI com Cypress.
        - Criação de ambientes e estratégias de testes.

    - role: QA Engineer
      time: Feb 2016 - Mar 2018
      company: deviceLab
      details: |
        - Atuação técnica e gerencial com foco em testes mobile, consultoria e gestão de produtos.
        - Experiência como Product Owner utilizando SCRUM.
        - Automação de testes mobile com Ruby/Cucumber, Python/Behave, Appium e Calabash.
        - Execução de testes de API e carga utilizando Postman e JMeter.

    - role: Analista de Testes
      time: Aug 2013 - Oct 2015
      company: VTEX
      details: |
        - Implementação de projeto de automação de testes cross-browser.
        - Desenvolvimento de testes em BDD utilizando C#, SpecFlow e Selenium.
        - Utilização de NUnit, SpecRun, Page Objects e execução paralela de testes.
